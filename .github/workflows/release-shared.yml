name: Release (shared)

# Reusable workflow (workflow_call only). This repo calls it through the
# wrapper in .github/workflows/release.yml; other projects run this release
# flow from their own repository with the same wrapper shape:
#
#   jobs:
#     build:
#       ... # your own build job, uploads the "dist" artifact
#     release:
#       needs: build
#       uses: almarklein/alver/.github/workflows/release-shared.yml@v1
#       permissions:
#         contents: write
#     publish-pypi:
#       needs: release
#       environment: pypi
#       permissions:
#         id-token: write
#       steps:
#         - uses: actions/download-artifact@v4
#           with: { name: dist, path: dist }
#         - uses: pypa/gh-action-pypi-publish@release/v1
#
# Everything runs in the *caller's* repo: the checkout, the git tag and the
# gh release are all the caller's. The caller's own workflow is expected to
# have a build job (wired before this one with needs:) that uploads the built
# files as an artifact (name given by the dist-artifact input, default
# "dist"); the single job below downloads that artifact before publishing.
# The PyPI publish is deliberately NOT part of this reusable workflow: PyPI's
# OIDC trusted publishing matches the token's workflow claims, which for a job
# in a reusable workflow name this file -- not supported by PyPI. The caller's
# workflow therefore declares its own publish-pypi job (see above) using
# pypa/gh-action-pypi-publish directly, so the claims name the caller's own
# workflow file.
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to set up
        type: string
        default: "3.14"
      dist-artifact:
        description: Name of the build artifact to download before publishing (uploaded by the caller's own build job)
        type: string
        default: "dist"
      release-branch:
        description: Branch name whose merged PRs into main trigger a release
        type: string
        default: "release"

jobs:

  # Everything in a single job: check that a release is allowed, create and
  # push the tag, then download the build artifact and create the gh release.
  release:
    name: Check, tag and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the gh release
    # Run only for: manual dispatch, a vx.y.z tag push, or a merged PR from
    # the release-branch into main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == inputs.release-branch)

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ inputs.python-version }}"

      - name: Install alver
        run: |
          # When running in the alver repo itself (or a fork), install from
          # the local checkout (this doubles as a test of the current code);
          # otherwise (e.g. when called as a reusable workflow from another
          # project) install alver from PyPI.
          if [ -f alver/__init__.py ]; then
            pip install .
          else
            pip install alver
          fi

      - name: Get version and tag
        run: |
          set -e
          VERSION=$(alver version)
          TAG="v${VERSION#v}"
          echo "Detected version $VERSION -> tag $TAG"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create and push version tag
        run: |
          set -e
          # When triggered by a tag push, the pushed tag must match the version.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PUSHED_TAG="${GITHUB_REF#refs/tags/}"
            if [ "$PUSHED_TAG" != "$TAG" ]; then
              echo "error: pushed tag '$PUSHED_TAG' does not match version $VERSION (expected '$TAG')" >&2
              exit 1
            fi
            echo "Pushed tag $PUSHED_TAG matches version $VERSION."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The tag may already exist, e.g. when this run was triggered by
          # pushing exactly this tag; that is fine, as long as it points at
          # the current commit.
          git tag "$TAG" 2>/dev/null || echo "Tag $TAG already exists locally, reusing it."
          if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "error: tag $TAG exists but does not point at the current commit (HEAD)" >&2
            exit 1
          fi
          if ! git push origin "$TAG" 2>/dev/null; then
            echo "Tag $TAG already on the remote; checking it points at this commit."
            git fetch -q origin "refs/tags/$TAG"
            if [ "$(git rev-parse "FETCH_HEAD^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "error: remote tag $TAG does not point at the current commit (HEAD)" >&2
              exit 1
            fi
          fi

      - name: Check release notes exist for the tag
        run: |
          set -e
          alver notes "$TAG" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "error: no release notes in CHANGELOG.md for $TAG; refusing to release" >&2
            exit 1
          fi
          echo "Release notes for $TAG:"
          cat release-notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist-artifact }} # artifact uploaded by the caller's own build job
          path: dist

      - name: Publish to Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --draft=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
