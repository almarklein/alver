name: Release

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # A tag that looks like vx.y.z is pushed.
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  # A PR is merged into main (the release-shared.yml checks the name of the branch).
  pull_request:
    types: [closed]
    branches: [main]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install build
      - name: Build package
        run: |
          pip install .
          python -m build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist  # must match the dist-artifact input of release-shared.yml
          path: dist/

  release:
    name: Release
    needs: build
    uses: ./.github/workflows/release-shared.yml   # <-- in the alver repo
    # uses: almarklein/alver/.github/workflows/release-shared.yml@main  # <-- in other repos
    permissions:
      contents: write  # to push the tag and create the gh release
    # Showing all options and their default values
    with:
      python-version: "3.14"  # Python version to set up
      dist-artifact: "dist"  # Name of the build artifact to download before publishing (uploaded by the caller's own build job)
      release-branch: "release"  # Branch name whose merged PRs into main trigger a release

  # PyPI trusted publishing (OIDC) must be declared in *this* workflow file
  publish-pypi:
    name: Publish Pypi
    needs: release
    runs-on: ubuntu-latest
    environment: pypi  # must match the environment of the PyPI trusted publisher
    permissions:
      id-token: write  # for PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist  # must match the artifact name of the 'build' job
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
