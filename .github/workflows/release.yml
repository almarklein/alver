name: Release

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # A tag that looks like vx.y.z is pushed.
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  # A PR from the release branch (default "release") is merged into main
  # (the head-branch check itself lives in release-shared.yml).
  pull_request:
    types: [closed]
    branches: [main]

# Wrapper around the shared reusable workflow, in the same shape as
# downstream projects use -- they call it remotely instead:
#   uses: almarklein/alver/.github/workflows/release-shared.yml@v1
# Each project builds its artifacts in the build job below and uploads them
# as the "dist" artifact; the shared workflow downloads and publishes them.
# The permissions on the release job are the ceiling for the GITHUB_TOKEN
# used inside the called workflow.
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install build
      - name: Build package
        run: |
          pip install .
          python -m build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist # must match the dist-artifact input of release-shared.yml
          path: dist/

  release:
    needs: build
    uses: ./.github/workflows/release-shared.yml
    permissions:
      contents: write # push the tag, create the gh release
      id-token: write # PyPI trusted publishing (OIDC)
    # Showing all options and their default values
    with:
      python-version: "3.14"  # Python version to set up
      environment: "pypi"  # GitHub environment used for publishing (must have the PyPI trusted publisher configured)
      dist-artifact: "dist"  # Name of the build artifact to download before publishing (uploaded by the caller's own build job)
      release-branch: "release"  # Branch name whose merged PRs into main trigger a release
      publish-pypi: true  # Publish the release to PyPI (OIDC trusted publishing via the environment)
      publish-github: true  # Create/update the GitHub release and upload the build artifacts
