name: Release

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # A tag that looks like vx.y.z is pushed.
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  # A PR from the "release" branch is merged into main.
  pull_request:
    types: [closed]
    branches: [main]
  # Reusable workflow: other projects can run this release flow from their
  # own repository with a small caller workflow:
  #
  #   jobs:
  #     release:
  #       uses: almarklein/alver/.github/workflows/release.yml@main
  #
  # Everything runs in the *caller's* repo: the checkout, the git tag, the
  # gh release and the OIDC token are all the caller's. The local build.yml
  # reference below resolves in the caller's repo too, so each project
  # provides its own .github/workflows/build.yml.
  workflow_call:
    inputs:
      python-version:
        description: Python version to set up
        type: string
        default: "3.14"
      environment:
        description: GitHub environment used for publishing (must have the PyPI trusted publisher configured)
        type: string
        default: "pypi"
      dist-artifact:
        description: Name of the artifact that the caller's build.yml uploads, downloaded before publishing
        type: string
        default: "dist"

jobs:

  check:
    name: Check whether a release is allowed
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
    # Run only for: manual dispatch, a vx.y.z tag push, or a merged
    # "release" -> main PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'release')

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags

      - uses: actions/setup-python@v5
        with:
          # The input default applies for workflow_call; the fallback keeps
          # the push/pull_request/workflow_dispatch triggers working.
          python-version: "${{ inputs.python-version || '3.14' }}"

      - name: Install alver
        run: |
          # When running in the alver repo itself (or a fork), install from
          # the local checkout (this doubles as a test of the current code);
          # otherwise (e.g. when called as a reusable workflow from another
          # project) install alver from PyPI.
          if [ -f alver/__init__.py ]; then
            pip install .
          else
            pip install alver
          fi

      - name: Get version and tag
        run: |
          set -e
          VERSION=$(alver version)
          TAG="v${VERSION#v}"
          echo "Detected version $VERSION -> tag $TAG"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create and push version tag
        run: |
          set -e
          # When triggered by a tag push, the pushed tag must match the version.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PUSHED_TAG="${GITHUB_REF#refs/tags/}"
            if [ "$PUSHED_TAG" != "$TAG" ]; then
              echo "error: pushed tag '$PUSHED_TAG' does not match version $VERSION (expected '$TAG')" >&2
              exit 1
            fi
            echo "Pushed tag $PUSHED_TAG matches version $VERSION."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The tag may already exist, e.g. when this run was triggered by
          # pushing exactly this tag; that is fine, as long as it points at
          # the current commit.
          git tag "$TAG" 2>/dev/null || echo "Tag $TAG already exists locally, reusing it."
          if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "error: tag $TAG exists but does not point at the current commit (HEAD)" >&2
            exit 1
          fi
          if ! git push origin "$TAG" 2>/dev/null; then
            echo "Tag $TAG already on the remote; checking it points at this commit."
            git fetch -q origin "refs/tags/$TAG"
            if [ "$(git rev-parse "FETCH_HEAD^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "error: remote tag $TAG does not point at the current commit (HEAD)" >&2
              exit 1
            fi
          fi

      - name: Check release notes exist for the tag
        run: |
          set -e
          alver notes "$TAG" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "error: no release notes in CHANGELOG.md for $TAG; refusing to release" >&2
            exit 1
          fi
          echo "Release notes for $TAG:"
          cat release-notes.md

  # Per-project build steps live in build.yml (reusable workflow). When this
  # workflow is called from another project (workflow_call above), this local
  # reference resolves in the *calling* repo, so each project provides its own
  # .github/workflows/build.yml; copy build.yml from this repo and edit it.
  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the gh release
      id-token: write # PyPI trusted publishing (OIDC)
    # Scoped to the GitHub environment (default "pypi"), matching the
    # environment name configured for the pending publisher on pypi.org.
    environment: ${{ inputs.environment || 'pypi' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ inputs.python-version || '3.14' }}"

      - name: Install alver
        run: |
          if [ -f alver/__init__.py ]; then
            pip install .
          else
            pip install alver
          fi

      - name: Get version and tag
        run: |
          set -e
          VERSION=$(alver version)
          TAG="v${VERSION#v}"
          echo "Detected version $VERSION -> tag $TAG"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist-artifact || 'dist' }} # artifact uploaded by the build job in build.yml
          path: dist

      - name: Get release notes from changelog
        run: |
          set -e
          alver notes "$TAG" > release-notes.md

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token/password: uses OIDC trusted publishing (id-token: write),
        # scoped via the job-level "pypi" environment.

      - name: Publish to Github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --draft=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
